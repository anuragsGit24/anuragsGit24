<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="465" viewBox="0 0 900 465">
    <style>
        .bg { fill: #ffffff; }
        .text { font-family: 'Courier New', Courier, monospace; fill: #24292e; font-size: 14px; }
        .dots { fill: #6e7781; }
        .face { fill: #24292e; stroke: #24292e; }
        .title { fill: #0969da; font-weight: bold; }
        .label { fill: #bc5b00; font-weight: bold; }
        .value { fill: #315a83; }
        .accent { fill: #57606a; }
        .cmd { fill: #1a7f37; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .t { opacity: 0; animation: fadeIn 0.24s ease-out forwards; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .cursor { fill: #315a83; opacity: 0; animation: fadeIn 0.1s 2.45s forwards, blink 1s 2.55s step-end infinite; }
        .details &gt; text:nth-of-type(4) .t { animation-delay: 0.72s !important; }
        .details &gt; text:nth-of-type(5) .t { animation-delay: 0.77s !important; }
        .details &gt; text:nth-of-type(6) .t { animation-delay: 0.82s !important; }
