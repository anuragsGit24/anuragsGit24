        .value { fill: #315a83; }
        .accent { fill: #57606a; }
        .cmd { fill: #1a7f37; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .t { opacity: 0; animation: fadeIn 0.1s forwards; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .cursor { fill: #315a83; opacity: 0; animation: fadeIn 0.1s forwards, blink 1s step-end infinite; }
