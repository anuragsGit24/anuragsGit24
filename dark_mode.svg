        <text y="120" class="text">. Languages.AI/ML: ........... PyTorch, TensorFlow, OpenCV</text>
        <text y="140" class="text">. Languages.Tools: ........... Docker, Git, AWS, GCP</text>
        <text y="160" class="text">. Focus.Domain: .............. CV, RAG, Backend Systems</text>
        
        <text y="200" class="text">- Contact -----------------------------</text>
        <text y="220" class="text">. Email: ..................... anuragsinghm08@gmail.com</text>
        <text y="240" class="text">. Location: .................. Mumbai, Maharashtra, India</text>
        
