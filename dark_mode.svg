        <text y="20" class="text">. OS: ........................ Linux Mint / Windows</text>
        <text y="40" class="text">. Coding since: <tspan class="dots" id="age_data_dots">.............. </tspan><tspan id="age_data">0 years, 0 months, 0 days</tspan></text>
        <text y="60" class="text">. College: ................... SPIT, Mumbai</text>
        <text y="80" class="text">. Role: ...................... Software Eng / ML &amp; GenAI</text>
