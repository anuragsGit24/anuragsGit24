        <text y="300" class="text">. Repos: <tspan class="dots" id="repo_data_dots">.</tspan><tspan id="repo_data">0</tspan> {Contrib: <tspan class="dots" id="contrib_data_dots">.</tspan><tspan id="contrib_data">0</tspan>} | Stars: <tspan class="dots" id="star_data_dots">...... </tspan><tspan id="star_data">0</tspan></text>
        <text y="320" class="text">. Commits: <tspan class="dots" id="commit_data_dots">........ </tspan><tspan id="commit_data">0</tspan> | Followers: <tspan class="dots" id="follower_data_dots">....... </tspan><tspan id="follower_data">0</tspan></text>
        <text y="340" class="text">. Lines of Code: <tspan id="loc_data">0</tspan> (<tspan id="loc_add">0</tspan>++, <tspan id="loc_del">0</tspan>--)</text>
