<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
    <style>
        .bg { fill: #0d1117; }
        .text { font-family: 'Courier New', Courier, monospace; fill: #c9d1d9; font-size: 14px; }
        .dots { fill: #8b949e; }
        .face { fill: #c9d1d9; stroke: #c9d1d9; }
        .title { fill: #58a6ff; font-weight: bold; }
        .cmd { fill: #58a6ff; }
        .label { fill: #3fb950; font-weight: bold; }
        .value { fill: #f0f6fc; }
        .accent { fill: #d2a8ff; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .t { opacity: 0; animation: fadeIn 0.1s forwards; }
	
	/* ADD THIS FOR THE BLINKING CURSOR */
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .cursor { opacity: 0; animation: fadeIn 0.1s forwards, blink 1s step-end infinite; }
    </style>
    <rect width="900" height="480" rx="10" class="bg"/>
    
    <!-- terminal title bar -->
    <rect x="0" y="0" width="985" height="34" fill="#0d1117" rx="15"/>
    <rect x="0" y="20" width="985" height="14" fill="#0d1117"/>
